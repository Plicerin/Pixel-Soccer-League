[package]
name = "pixel-soccer-league-desktop"
version = "0.1.0"
description = "Desktop wrapper for Pixel Soccer League"
authors = ["Plicerin"]
license = "UNLICENSED"
repository = "https://github.com/Plicerin/Pixel-Soccer-League"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pixel_soccer_league_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
